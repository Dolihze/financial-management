[package]
name = "financial-management"
version = "0.1.0"
description = "公司财务管理软件"
edition = "2021"

[lib]
name = "financial_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows Job Object：保证主进程以任何方式退出时，系统都会一并终止 sidecar 后端
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# 发布构建：把前端静态资源内嵌进 exe，并改用自定义协议加载（而不是 devUrl）。
# `tauri dev` 用 --no-default-features 关闭它；`tauri build` 与直接 `cargo build --release` 都会启用。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
